name: smart_alarm_task_scheduler
description: "Smart Alarm & Task Scheduler Clock App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  # Notifications & Alarms
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  # Audio playback
  audioplayers: ^6.1.0
  # HTTP requests
  http: ^1.4.0
  # Location detection for dynamic holidays
  geolocator: ^13.0.4
  # Excel import/export
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon-launcher-2.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon-launcher-2.png
    - assets/banner.png
    - assets/music/
